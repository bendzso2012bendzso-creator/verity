
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verity</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 35px;
    }

    button {
      display: block;
      width: 320px;
      max-width: 85vw;
      padding: 15px;
      margin: 12px auto;
      background: #171717;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #292929;
    }

    .result {
      margin-top: 25px;
      font-size: 60px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="app">

    <div id="page1">
      <h1>hey its me</h1>
      <button onclick="answer1(true)">its verity</button>
      <button onclick="answer1(false)">its not verity</button>
      <button onclick="answer1(false)">dont ask me anything</button>
      <div id="result1" class="result"></div>
    </div>

    <div id="page2" class="hidden">
      <h1>ask me anything</h1>
      <button onclick="answer2(true)">i know about a million things</button>
      <button onclick="answer2(false)">capital of france</button>
      <button onclick="answer2(false)">paris</button>
      <div id="result2" class="result"></div>
    </div>

    <div id="page3" class="hidden">
      <h1>whats the capital of france</h1>
      <button onclick="answer3(true)">oh oui oui oui it is paris merci</button>
      <button onclick="answer3(false)">italy rome</button>
      <button onclick="answer3(false)">france</button>
      <div id="result3" class="result"></div>
    </div>

    <div id="page4" class="hidden">
      <h1>what does the cow say?</h1>
      <button onclick="answer4(false)">nothing</button>
      <button onclick="answer4(false)">moo moo moo</button>
      <button onclick="answer4(true)">oh moo moo moo is speak that too all day</button>
      <div id="result4" class="result"></div>
    </div>

  </div>

  <script>
    function showWrong(id) {
      const result = document.getElementById(id);
      result.textContent = "✕";
      result.style.color = "#ff4545";
    }

    function answer1(correct) {
      if (correct) {
        document.getElementById("page1").classList.add("hidden");
        document.getElementById("page2").classList.remove("hidden");
      } else {
        showWrong("result1");
      }
    }

    function answer2(correct) {
      if (correct) {
        document.getElementById("page2").classList.add("hidden");
        document.getElementById("page3").classList.remove("hidden");
      } else {
        showWrong("result2");
      }
    }

    function answer3(correct) {
      if (correct) {
        document.getElementById("page3").classList.add("hidden");
        document.getElementById("page4").classList.remove("hidden");
      } else {
        showWrong("result3");
      }
    }

    function answer4(correct) {
      const result = document.getElementById("result4");

      if (correct) {
        result.textContent = "✓";
        result.style.color = "#35e879";
      } else {
        showWrong("result4");
      }
    }
  </script>
</body>
</html>
